name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu]"

      - name: Import smoke
        run: python -c "import leanmap; print(leanmap.__version__)"

      - name: CLI smoke
        run: leanmap --help

      - name: Pytest
        run: pytest -q

  ddp-gloo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu]"

      - name: DDP gloo (2-rank optional integration)
        env:
          LEANMAP_DDP_TEST: "1"
        run: pytest tests/test_ddp.py -q --tb=line
